name: DynamicQRCodes

options:
  bundleIdPrefix: cloud.charging.open
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  DynamicQRCodes:
    type: application
    platform: iOS
    sources:
      - DynamicQRCodes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.charging.open.dynamicqrcodes
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is required to scan QR codes"
        INFOPLIST_KEY_CFBundleDisplayName: "DynamicQRCodes"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
